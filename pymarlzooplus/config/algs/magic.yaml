# --- MAGIC with Parallel Runner (16 Threads) ---

# Action selector: multinomial
action_selector: "multinomial"
mask_before_softmax: True

# Epsilon schedule parameters (required by MultinomialActionSelector)
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0

# Parallel runner configuration
runner: "parallel"
batch_size_run: 16

# Replay buffer sizes
buffer_size: 16
batch_size: 16

# Learning rate and model dimension
lr: 0.0003
hidden_dim: 128

# Observation preprocessing flags
obs_agent_id: True
obs_last_action: True
obs_individual_obs: False

# MAGIC model components
agent_output_type: "pi_logits"
mac: "magic_mac"
agent: "magic_agent"
learner: "magic_learner"
critic_type: "magic_critic"

# Reward/return normalization flags
standardise_returns: False
standardise_rewards: True
use_rnn: True

# Algorithm identification name
name: "magic"

# MAGIC-specific GAT & communication hyperparameters
self_loop_type1: 2
self_loop_type2: 2
gat_hidden_dim: 32
gat_num_heads: 4
gat_num_heads_out: 1
gat_encoder_out_size: 64
ge_num_heads: 4
value_coeff: 0.01
entropy_coef: 0.0

# RMSProp optimizer hyperparameters
magic_optim_alpha: 0.97
magic_optim_eps: 0.000001

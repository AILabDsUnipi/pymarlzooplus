# --- MAGIC specific parameters ---

action_selector: "soft_policies"
mask_before_softmax: True

# Keep the default CPU path lightweight for local Mac experiments.
runner: "episode"
batch_size_run: 1
buffer_size: 16
batch_size: 4

target_update_interval_or_tau: 0.01

lr: 0.0005
hidden_dim: 64

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

mac: "magic_mac"
agent: "magic_agent"
agent_output_type: "pi_logits"
learner: "magic_learner"
critic_type: "magic_critic"

entropy_coef: 0.0
standardise_returns: False
standardise_rewards: False
use_rnn: True
value_coeff: 0.01
magic_value_coeff: 0.01
magic_entropy_coef: 0.0
magic_mean_ratio: 0.0
magic_normalize_advantages: False
magic_optim_alpha: 0.97
magic_optim_eps: 0.000001

# MAGIC communication block. These names intentionally use a prefix so they do
# not collide with other PyMARLZoo+ algorithms.
magic_directed: False
magic_gat_hidden_dim: 64
magic_gat_num_heads: 1
magic_gat_num_heads_out: 1
magic_ge_num_heads: 4
magic_use_gat_encoder: False
magic_gat_encoder_out_dim: 64
magic_first_graph_complete: False
magic_second_graph_complete: False
magic_learn_second_graph: True
magic_self_loop_type1: 1
magic_self_loop_type2: 1
magic_first_gat_normalize: False
magic_second_gat_normalize: False
magic_gat_encoder_normalize: False
magic_message_encoder: False
magic_message_decoder: False
magic_comm_mask_zero: False
magic_comm_init: "uniform"

name: "magic"

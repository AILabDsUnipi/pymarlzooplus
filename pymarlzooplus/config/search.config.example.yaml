exclude: null
grid-search:

  "--config":
    - "iql"
    - "iql_ns"
    - "updet"

  lr:
    - 0.0001
    - 0.0003
    - 0.0005

  standardise_rewards:
    - True

  use_rnn:
    - False

  target_update_interval_or_tau:
    - 200
    - 0.01

  hidden_dim:
    - 64
    - 128

  evaluation_epsilon:
    - 0.0
    - 0.05

  epsilon_anneal_time:
    - 50000
    - 200000

  t_max:
    - 2050000
  test_nepisode:
    - 100
  test_interval:
    - 25000
  log_interval:
    - 25000
  save_model_interval:
    - 50000
  save_model:
    - false
    
grid-search-groups:
  env0:
    - "--env-config": "gymma"
    - env_args.key: lbforaging:Foraging-4s-11x11-3p-2f-coop-v2
    - env_args.time_limit: 25

plotting:
  base_sacred_path: "./results/sacred"
  base_save_path: "./results/multiple-exps-plots"
  env_name: "lbforaging:Foraging-4s-11x11-3p-2f-coop-v2"
  plot_train: false
  plot_legend_bool: true
  algorithm_legend_map:
    "qmix": "QMIX"
    "qmix_ns": "QMIX_ns"
    "cds": "CDS"
    "coma": "COMA"
    "coma_ns": "COMA_ns"
    "emc": "EMC"
    "eoi": "EOI"
    "happo": "HAPPO"
    "ia2c": "IA2C"
    "ia2c_ns": "IA2C_ns"
    "ippo": "IPPO"
    "ippo_ns": "IPPO_ns"
    "iql": "IQL"
    "iql_ns": "IQL_ns"
    "maa2c": "MAA2C"
    "maa2c_ns": "MAA2C_ns"
    "maddpg": "MADDPG"
    "maddpg_ns": "MADDPG_ns"
    "mappo": "MAPPO"
    "mappo_ns": "MAPPO_ns"
    "maser": "MASER"
    "mat_dec": "MAT-DEC"
    "qplex": "QPLEX"
    "vdn": "VDN"
    "vdn_ns": "VDN_ns"
    "maven": "MAVEN"
    "commformer": "CommFormer"
    "updet": "UPDeT"